name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev + bigquery extras)
        run: pip install -e ".[dev,bigquery]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
