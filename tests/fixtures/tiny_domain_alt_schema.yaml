# tiny_domain.yaml's vocabulary, verbatim, over a DIFFERENT PHYSICAL SCHEMA: different table
# names, different column names, and only the four REQUIRED node columns — exactly the shape
# README.md's "expose two views" example teaches. Everything above `table_config` is identical
# to tiny_domain.yaml on purpose, so tests/test_conformance.py can run both and assert the
# results match: any difference is schema coupling, not vocabulary coupling.
#
# tiny_domain.yaml proves TYPE-name portability. This file proves COLUMN-name portability,
# which is the half that rotted undetected while both fixtures shared org_graph's table_config.

name: tiny_domain_alt_schema
version: "1.0"

entity_types:
  - name: Service
    description: A deployed software service.
  - name: Incident
    description: An operational incident affecting one or more services.
  - name: Team
    description: A team responsible for one or more services.

relationship_types:
  - name: runs_on
    description: The source service runs on (is hosted by) the target service or team's infrastructure.
    source_types: [Service]
    target_types: [Service, Team]
    inverse: null
    traversal: transitive
    canonical_direction: source_to_target
    max_depth: 5

  - name: caused_by
    description: The source incident was caused by the target incident.
    source_types: [Incident]
    target_types: [Incident]
    inverse: null
    traversal: transitive
    canonical_direction: source_to_target
    max_depth: 2

  - name: on_call_for
    description: The source team is on call for the target service, team, or incident.
    source_types: [Team]
    target_types: [Service, Team, Incident]
    inverse: null
    traversal: terminal
    canonical_direction: source_to_target
    max_depth: 1

semantics:
  - name: upstream
    relationship_types: [caused_by]
  - name: hierarchy
    relationship_types: [runs_on]
  - name: ownership
    relationship_types: [on_call_for]
  - name: risk
    relationship_types: [caused_by]

table_config:
  node_table: graph_nodes
  edge_table: graph_edges
  node_id_column: node_id
  node_name_column: title
  node_type_column: node_type
  node_status_column: state
  edge_source_column: src_id
  edge_target_column: dst_id
  edge_type_column: edge_type
  # node_extra_columns deliberately omitted: a four-column node view must work as-is.
