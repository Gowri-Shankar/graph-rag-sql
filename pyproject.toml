[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-rag-sql"
version = "0.1.0"
description = "Graph traversal for RAG without a graph database — recursive-CTE patterns on a SQL warehouse."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]
dev = ["pytest>=8", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag"]

[tool.hatch.build.targets.wheel.force-include]
"ontology" = "graph_rag/ontology_data"

[tool.hatch.build.targets.sdist]
include = ["src/graph_rag", "ontology"]

[tool.ruff]
line-length = 100
target-version = "py311"
