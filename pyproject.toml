[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-rag-sql"
version = "0.1.0"
description = "Graph traversal for RAG without a graph database — recursive-CTE patterns on a SQL warehouse."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25"]
dev = ["pytest>=8", "ruff"]
bench = ["matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag"]

[tool.hatch.build.targets.wheel.force-include]
"ontology" = "graph_rag/ontology_data"

[tool.hatch.build.targets.sdist]
include = ["src/graph_rag", "ontology"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]

# `pip freeze` snapshot of the direct dependencies actually installed and tested in the
# development venv (Python 3.11.9) as of the M4 milestone. Documentation only — the `>=` floors
# in [project.dependencies]/[project.optional-dependencies] above are what's actually enforced.
# duckdb==1.5.5
# pydantic==2.13.4
# pydantic_core==2.46.4
# pytest==9.1.1
# PyYAML==6.0.3
# ruff==0.16.4
# google-cloud-bigquery: not installed in this dev venv (the [bigquery] extra is optional by
#   design — importing graph_rag never requires it; CI installs it to run the mocked tests).
